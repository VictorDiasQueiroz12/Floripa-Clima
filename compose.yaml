#define os serviços que o docker vai executar
services:
  db:
    #imagem oficial com o postgreSQL versão 16
    #uma imagem é oque dá origem a um container
    image: postgres:16

    #le as configurações do ".env"
    env_file:
      - .env

    #liga uma porta do computador a porta do container
    #computador: 5433 -> postgreSQL no container: 5432
    #"127.0.0.1" restringe o acesso ao proprio computador

    #O endereço 127.0.0.1 é a interface de loopback (também conhecida como localhost). Ela é uma rede virtual interna que nunca sai de dentro do seu chip de rede. Ela serve apenas para o computador conversar com ele mesmo.
    ports:
      - "127.0.0.1:5433:5432"

    #guarda os arquivos do banco em um volume persistente
    #desse jeito recriar um container não elimina esses dados
    #usa o diretorio real dos dados do PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data

    #verifica periodicamente se o PostgreSQL aceita conexões
    healthcheck:
      #CMD-SHELL executa o comando usando o shell do container
      #pg_isready verifica a disponibilidade do PostgreSQL
      #$$ deixa a variável ser expandida dentro do container
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'

      #intervalo entre as verificações
      interval: 5s

      #tempo máximo de cada verificação
      timeout: 5s

      #quantidade de falhas consecutivas até marcar como unhealthy
      retries: 12

  migrations:
    #constrói uma imagem usando o Dockerfile do backend
    build:
      #define a raiz do projeto como contexto de construção
      #os caminhos de origem dos COPY partem dessa pasta
      context: .
      dockerfile: backend/Dockerfile

    #disponibiliza as configurações do banco no container
    env_file:
      - .env

    #essas configurações prevalecem sobre as mesmas chaves do env_file
    environment:
      #na rede do Compose, db é o endereço do serviço PostgreSQL
      POSTGRES_HOST: db

      #containers conversam pela porta interna do PostgreSQL
      POSTGRES_PORT: "5432"

    #aguarda o banco estar pronto antes de executar as migrations
    depends_on:
      db:
        condition: service_healthy

    #substitui o CMD do Dockerfile por este comando
    #aplica as migrations pendentes e encerra o container
    command:
      - alembic
      - -c
      - /app/backend/alembic.ini
      - upgrade
      - head

  backend:
    #usa o mesmo Dockerfile do serviço de migrations
    #mas mantém o CMD que executa backend.app
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Permite ao proxy Nginx acessar a API pela rede interna.
      API_HOST: "0.0.0.0"
      API_PORT: "8000"

    depends_on:
      #aguarda o banco aceitar conexões
      db:
        condition: service_healthy

      #só inicia se as migrations terminarem sem erro
      migrations:
        condition: service_completed_successfully

    #permite acessar a API e /docs diretamente pelo Windows
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    #constrói a imagem do Nginx com os arquivos do frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile

    #inicia depois que o container do backend estiver em execução
    #isso não é uma verificação de saúde da API
    depends_on:
      backend:
        condition: service_started

    #computador: 8080 -> Nginx no container: 80
    ports:
      - "127.0.0.1:8080:80"

#declara o volume utilizado pelo serviço db

volumes:
  postgres_data: {}