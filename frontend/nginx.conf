server {
    # Recebe requisições na porta 80 dentro do container.
    listen 80;

    # Pasta onde copiamos os arquivos do frontend.
    root /usr/share/nginx/html;

    # Arquivo usado ao abrir a página inicial.
    index index.html;

    # Mantém os caminhos atuais /static/style.css e /static/script.js.
    # alias aponta para a pasta real dos arquivos.
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    # Entrega arquivos da página.
    # Se o caminho não existir, responde com erro 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Encaminha a consulta ao serviço chamado backend no Compose.
    # Sem uma barra após a porta, preservamos o caminho /clima.
    location = /clima {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Encaminha o pedido de execução do ETL.
    location = /importar {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;

        # Permite aguardar a resposta durante a importação.
        proxy_read_timeout 120s;
    }

    # Encaminha a verificação da API.
    location = /saude {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}