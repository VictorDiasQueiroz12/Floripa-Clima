apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: floripa-clima
spec:
  # replicas is intentionally omitted; the HPA manages scaling.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: floripa-clima-backend:k8s
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: floripa-clima-config
            - secretRef:
                name: floripa-clima-secret
          startupProbe:
            httpGet:
              path: /saude
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /saude
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /saude
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
